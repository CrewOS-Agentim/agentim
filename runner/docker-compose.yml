# AgentHub Runner in Docker.
#
#   docker compose up -d                    # runner, talking to Ollama / Docker Model Runner on the host
#   docker compose --profile ollama up -d   # also run Ollama itself in a container
#   docker compose logs runner              # prints the URL and pairing token for the app
#
# On a Mac, containers can't use the Apple GPU. For fast local models run Ollama
# natively or use Docker Model Runner, and keep only the runner here. On Linux
# with an NVIDIA GPU, the `ollama` profile below uses the GPU.
services:
  runner:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - runner-data:/data
    environment:
      # Leave unset to generate a token on first start (shown in the logs).
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Linux + NVIDIA: uncomment to give Ollama the GPU.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  runner-data:
  ollama-models:
