# agentim: the default, always-on stack.
#
#   cp .env.example .env    # add your bot tokens + allowed users
#   docker compose up -d
#
# Everything restarts on its own (crash, Docker restart, reboot).
# On macOS, run deploy/macos/install.sh once so Docker itself comes back after
# a reboot and the Mac stays awake with the lid closed while charging.
name: agentim

services:
  # Local Hugging Face models (GGUF), served by Ollama. Pulled on first start
  # after the runner checks they fit in memory.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # How long a model stays in memory after its last use (This Mac → Free memory unloads right away).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    restart: unless-stopped
    # Linux + NVIDIA: uncomment to use the GPU.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Memory checks, model pulls, one OpenAI-compatible API over every backend.
  runner:
    build: ./runner
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}
      OLLAMA_URL: http://ollama:11434
      # Only the stack's own Ollama: other ports on the host (e.g. the voice server on :8000) aren't chat models.
      RUNNER_DISABLE: lmstudio,llamacpp,vllm,docker
    volumes:
      - runner-data:/data
    ports:
      - "8765:8765"   # for the iOS app
    depends_on: [ollama]
    restart: unless-stopped

  # Telegram, Slack and WhatsApp to agents, skills and the router.
  gateway:
    build: ./gateway
    env_file: .env
    environment:
      # The native runner on the Mac (deploy/macos) adds LTX video; harmless if it isn't running.
      RUNNER_URLS: http://runner:8765,http://host.docker.internal:8766
      WAHA_URL: http://whatsapp:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-}
    volumes:
      - gateway-data:/data
      # Your private skills and agents (e.g. company playbooks): ./private/skills/*.md and ./private/agents.json.
      - ./private:/private:ro
    ports:
      - "8780:8780"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [runner, whatsapp]
    restart: unless-stopped

  # Optional: a public HTTPS address for ChatGPT connectors (they can't reach localhost).
  # Start it with deploy/macos/connect-chatgpt.sh (or This Mac → Connect ChatGPT in the app). Only
  # /mcp/<AGENTIM_MCP_SECRET> works without the API token. The address changes when the tunnel restarts.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [chatgpt]
    command: tunnel --no-autoupdate --url http://gateway:8780
    depends_on: [gateway]
    restart: unless-stopped

  # WhatsApp bridge (WAHA). Link your number once: open http://localhost:3000/dashboard and scan the QR.
  whatsapp:
    # Apple silicon needs the arm build (WAHA_TAG=arm); onboarding and install.sh set it.
    image: devlikeapro/waha:${WAHA_TAG:-latest}
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?set WAHA_DASHBOARD_PASSWORD in .env}
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WHATSAPP_HOOK_URL: http://gateway:8780/webhooks/whatsapp?secret=${AGENTIM_WEBHOOK_SECRET:?set AGENTIM_WEBHOOK_SECRET in .env}
      WHATSAPP_HOOK_EVENTS: message
    volumes:
      - whatsapp-sessions:/app/.sessions
    ports:
      - "127.0.0.1:3000:3000"   # dashboard for the QR code; local only
    restart: unless-stopped

  # Voice notes in and out: Whisper (speech-to-text) + Kokoro (text-to-speech), OpenAI-compatible.
  # Enabled by onboarding with COMPOSE_PROFILES=voice; models download on first use.
  voice:
    # If ghcr.io is blocked, onboarding falls back to the Docker Hub build (speech-to-text only).
    image: ${VOICE_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cpu}
    profiles: ["voice"]
    # A fresh named volume is root-owned, so the image's non-root user couldn't save models into it.
    user: "0:0"
    environment:
      HF_HOME: /models
      HF_HUB_CACHE: /models/hub
    volumes:
      - voice-models:/models
    ports:
      - "127.0.0.1:8000:8000"   # onboarding downloads the chosen models through this
    restart: unless-stopped

volumes:
  ollama-models:
  runner-data:
  gateway-data:
  whatsapp-sessions:
  voice-models:
