name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r gateway/requirements.txt
      - name: Gateway
        run: python -m unittest discover -s gateway/tests -v
      - name: Runner
        working-directory: runner
        run: python -m unittest test_runner -v
      - name: Deploy scripts
        run: python -m unittest discover -s deploy/tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentim-gateway gateway
      - run: docker build -t agentim-runner runner
      - name: Compose file is valid
        run: cp .env.example .env && docker compose config -q

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodebuild -downloadComponent MetalToolchain || true
      - run: xcodegen generate
      - name: Build and test the Mac app
        run: >
          xcodebuild -project agentim.xcodeproj -scheme AgentHub -destination platform=macOS
          -skipMacroValidation -skipPackagePluginValidation test
      - name: Deploy scripts (launchd plists)
        run: python3 -m unittest discover -s deploy/tests -v
