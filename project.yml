name: agentim
options:
  bundleIdPrefix: com.agentim
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signs to run locally; set your team in Xcode to distribute.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.32.3"
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"

targets:
  AgentHub:
    type: application
    platform: macOS
    sources:
      - AgentHub
      # Built-in skills and agents are shared with the gateway.
      - path: gateway/skills
        type: folder
        buildPhase: resources
      - path: gateway/config/agents.json
        buildPhase: resources
    postCompileScripts:
      # Ship the Docker stack inside the app so onboarding works without the repo.
      - name: Bundle Docker stack
        basedOnDependencyAnalysis: false
        script: |
          STACK="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/stack"
          mkdir -p "$STACK"
          rsync -a --delete --exclude tests --exclude __pycache__ --exclude '*.pyc' --exclude 'test_*.py' \
            "$SRCROOT/gateway" "$SRCROOT/runner" "$SRCROOT/deploy" "$SRCROOT/docker-compose.yml" "$SRCROOT/.env.example" "$STACK/"
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
    info:
      path: AgentHub/Resources/Info.plist
      properties:
        CFBundleDisplayName: agentim
        CFBundleName: agentim
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: MIT License
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: agentim
        PRODUCT_MODULE_NAME: AgentHub
        PRODUCT_BUNDLE_IDENTIFIER: com.agentim.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # Not sandboxed: the control center runs docker, pmset and launchctl for you.
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  AgentHubTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AgentHubTests
    dependencies:
      - target: AgentHub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/agentim.app/Contents/MacOS/agentim"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  AgentHub:
    build:
      targets:
        AgentHub: all
        AgentHubTests: [test]
    test:
      targets:
        - AgentHubTests
