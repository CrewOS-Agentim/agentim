name: AgentHub
options:
  bundleIdPrefix: com.agenthub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.32.3"
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"

targets:
  AgentHub:
    type: application
    platform: iOS
    sources:
      - AgentHub
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
    entitlements:
      path: AgentHub/Resources/AgentHub.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: AgentHub/Resources/Info.plist
      properties:
        CFBundleDisplayName: AgentHub
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agenthub.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  AgentHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AgentHubTests
    dependencies:
      - target: AgentHub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AgentHub.app/AgentHub"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  AgentHub:
    build:
      targets:
        AgentHub: all
        AgentHubTests: [test]
    test:
      targets:
        - AgentHubTests
